name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # GitHub can't read Gradle builds on its own; this uploads the resolved dependency list
  # so the Security tab (Dependabot alerts) and the review below know what the app uses.
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v6

  review:
    name: Dependency review
    needs: submit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # summary comment when it fails
    steps:
      # Fails the PR if it adds a dependency with a known high/critical vulnerability.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
