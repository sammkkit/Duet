name: Release

# Runs after CI finishes on main, so it never shows as a "skipped" check on PRs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Two merges in quick succession must not both pick the same pre-release number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every green merge to main publishes the APK:
  #   new versionName  -> release     v<version>                    (marked Latest)
  #   same versionName -> pre-release v<version>-pre-release-<n>    (Latest unchanged)
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Optional: with these two repo secrets set, the APK is also sent to a Telegram chat. Without them that step skips.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    permissions:
      contents: write
      actions: read # download the APK from the CI run
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: duet-debug-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' androidApp/build.gradle.kts)
          base="v$version"

          if ! gh release view "$base" > /dev/null 2>&1; then
            gh release create "$base" apk/*.apk --target "$SHA" --generate-notes --latest
            echo "tag=$base" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest existing pre-release number for this version, + 1.
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$base-pre-release-" --jq '.[].ref' \
            | sed -E "s|.*-pre-release-([0-9]+)$|\1|" | sort -n | tail -1)
          tag="$base-pre-release-$(( ${last:-0} + 1 ))"

          gh release create "$tag" apk/*.apk --target "$SHA" --prerelease --latest=false \
            --title "$tag" --notes-start-tag "$base" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Bot API sendDocument: the APK lands in the chat as a file, one tap to install (50 MB limit; ours is ~17 MB).
      - name: Send APK to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TAG: ${{ steps.publish.outputs.tag }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          apk=$(ls apk/*.apk | head -1)
          curl --fail-with-body -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"$apk;filename=Duet-$TAG.apk" \
            -F caption="Duet $TAG
          ${MESSAGE%%$'\n'*}
          https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > /dev/null
