name: CI

# push only on main: on PR branches the pull_request event already runs everything (no duplicate runs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab, for any branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Parallel jobs so each shows as its own check on the PR.
jobs:
  lint:
    name: Lint (ktlint + Android lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar, so a tampered wrapper fails the build.
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck lint
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/lint-results-*.html

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test report check with per-test annotations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew allTests
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: Test report
          detailed_summary: true
          include_passed: true

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug
      # Download from the run page and install on a phone to try this commit.
      - uses: actions/upload-artifact@v7
        with:
          name: duet-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Linux can't build iOS, so this one runs on macOS (free for public repos, but slower to start).
  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # commonTest again, this time on Kotlin/Native in the simulator.
      - run: ./gradlew iosSimulatorArm64Test
      # The real app: Xcode runs the "Compile Kotlin Framework" phase (Gradle) and then the Swift code.
      - run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp
          -sdk iphonesimulator -arch arm64 -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
