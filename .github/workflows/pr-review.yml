name: PR review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # From `claude setup-token` (uses your Claude Pro/Max plan). Repo secret: CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for DualCam, a Kotlin Multiplatform camera app. docs/PLAN.md describes the phases,
            the module rules and what each phase's review checks. The author is learning, so explain *why*.

            Check: architecture and module boundaries (core never depends on shared), correctness,
            Kotlin/Compose style, threading, lifecycle and leaks.
            Don't suggest full rewrites. Report issues by severity (blocker / should fix / nit).

            Use inline comments for issues on specific lines and one `gh pr comment` for the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
